<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Coffee Shops · Map Style PoC</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" />
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif; }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #eee; }
    #map { position: fixed; inset: 0; }
    .panel {
      position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      width: min(760px, calc(100vw - 20px)); padding: 10px;
      border: 1px solid rgba(0,0,0,.08); border-radius: 18px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    .row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .row + .row { margin-top: 7px; }
    button {
      appearance: none; border: 0; border-radius: 999px; padding: 8px 12px; min-height: 34px;
      font: inherit; font-size: 13px; line-height: 1; color: #222; background: rgba(0,0,0,.06); cursor: pointer;
    }
    button:hover { background: rgba(0,0,0,.1); }
    button.active { color: #fff; background: #111; }
    button:disabled { opacity: .45; cursor: default; }
    .spacer { flex: 1; }
    .status { padding: 0 5px; font-size: 12px; color: #666; white-space: nowrap; }
    .notice {
      position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 999px;
      background: rgba(255,255,255,.9); backdrop-filter: blur(14px); box-shadow: 0 4px 18px rgba(0,0,0,.1);
      font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .notice.error { color: #9b1c1c; background: rgba(255,245,245,.94); }
    .maplibregl-ctrl-top-right { top: 106px; }
    @media (max-width: 600px) {
      .panel { top: max(8px, env(safe-area-inset-top)); width: calc(100vw - 16px); border-radius: 16px; padding: 8px; }
      button { padding: 8px 10px; font-size: 12px; }
      .status { display: none; }
      .maplibregl-ctrl-top-right { top: 122px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" aria-label="地图样式对比控制">
    <div class="row" id="styleButtons">
      <button type="button" data-style="positron">Positron</button>
      <button type="button" data-style="bright" class="active">Bright</button>
      <button type="button" data-style="liberty">Liberty</button>
      <span class="spacer"></span>
      <button type="button" id="toggle3d">3D 建筑</button>
      <span class="status" id="status">Tokyo · Shibuya</span>
    </div>
    <div class="row" id="cityButtons">
      <button type="button" data-city="tokyo" class="active">东京 · 涩谷</button>
      <button type="button" data-city="hongkong">香港 · 中环</button>
      <button type="button" data-city="beijing">北京 · 三里屯</button>
      <span class="spacer"></span>
      <button type="button" id="view2d">俯视</button>
      <button type="button" id="viewTilt">倾斜</button>
    </div>
  </div>

  <div class="notice" id="notice">Bright 已设为默认；3D 建筑可独立开启，不再与 Style 切换绑定</div>

  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script>
    (() => {
      const STYLES = {
        positron: 'https://tiles.openfreemap.org/styles/positron',
        bright: 'https://tiles.openfreemap.org/styles/bright',
        liberty: 'https://tiles.openfreemap.org/styles/liberty'
      };
      const CITIES = {
        tokyo: { label: 'Tokyo · Shibuya', center: [139.70055, 35.65950], zoom: 15.7, bearing: -15 },
        hongkong: { label: 'Hong Kong · Central', center: [114.15680, 22.28190], zoom: 15.8, bearing: -18 },
        beijing: { label: 'Beijing · Sanlitun', center: [116.45420, 39.93670], zoom: 15.6, bearing: -12 }
      };

      let activeStyle = 'bright';
      let activeCity = 'tokyo';
      let threeD = false;
      let styleReady = false;
      let queuedCity = null;

      const notice = document.getElementById('notice');
      const status = document.getElementById('status');
      const toggle3d = document.getElementById('toggle3d');
      const view2d = document.getElementById('view2d');
      const viewTilt = document.getElementById('viewTilt');

      const map = new maplibregl.Map({
        container: 'map',
        style: STYLES[activeStyle],
        center: CITIES[activeCity].center,
        zoom: CITIES[activeCity].zoom,
        pitch: 0,
        bearing: 0,
        maxZoom: 19,
        attributionControl: false,
        canvasContextAttributes: { antialias: true }
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');
      map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');

      function showNotice(text, isError = false) {
        notice.textContent = text;
        notice.classList.toggle('error', isError);
      }

      function setButtonsEnabled(enabled) {
        document.querySelectorAll('[data-style], [data-city], #toggle3d').forEach(button => { button.disabled = !enabled; });
      }

      function firstLabelLayerId() {
        return (map.getStyle()?.layers || []).find(layer => layer.type === 'symbol' && layer.layout?.['text-field'])?.id;
      }

      function findBuildingSource() {
        const layer = (map.getStyle()?.layers || []).find(item => item.source && item['source-layer'] === 'building');
        return layer?.source || null;
      }

      function removeInjected3D() {
        if (map.getLayer('coffee-poc-3d-buildings')) map.removeLayer('coffee-poc-3d-buildings');
      }

      function apply3D() {
        if (!styleReady) return;
        removeInjected3D();
        if (!threeD) return;

        const source = findBuildingSource();
        if (!source) {
          showNotice('当前 Style 没找到 building source，无法添加 3D 建筑', true);
          threeD = false;
          toggle3d.classList.remove('active');
          return;
        }

        map.addLayer({
          id: 'coffee-poc-3d-buildings',
          source,
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 14.8,
          paint: {
            'fill-extrusion-color': '#d8d5cf',
            'fill-extrusion-opacity': 0.86,
            'fill-extrusion-height': [
              'interpolate', ['linear'], ['zoom'],
              14.8, 0,
              15.8, ['coalesce', ['to-number', ['get', 'render_height']], 6]
            ],
            'fill-extrusion-base': [
              'interpolate', ['linear'], ['zoom'],
              14.8, 0,
              15.8, ['coalesce', ['to-number', ['get', 'render_min_height']], 0]
            ]
          }
        }, firstLabelLayerId());
      }

      function moveToCity(cityKey, animated = true) {
        activeCity = cityKey;
        const city = CITIES[cityKey];
        status.textContent = city.label;
        document.querySelectorAll('[data-city]').forEach(button => button.classList.toggle('active', button.dataset.city === cityKey));

        const camera = {
          center: city.center,
          zoom: city.zoom,
          pitch: threeD ? 48 : 0,
          bearing: threeD ? city.bearing : 0,
          essential: true
        };
        if (animated) map.flyTo({ ...camera, duration: 550 });
        else map.jumpTo(camera);
        showNotice(`${city.label} · ${activeStyle}${threeD ? ' · 3D' : ''}`);
      }

      function afterStyleReady() {
        styleReady = true;
        apply3D();
        setButtonsEnabled(true);
        if (queuedCity) {
          const city = queuedCity;
          queuedCity = null;
          moveToCity(city, false);
        } else {
          moveToCity(activeCity, false);
        }
      }

      map.on('style.load', afterStyleReady);
      map.on('error', event => {
        const message = event?.error?.message || '未知地图错误';
        console.error('[Map PoC]', event?.error || event);
        showNotice(`地图错误：${message}`, true);
      });

      document.getElementById('styleButtons').addEventListener('click', event => {
        const button = event.target.closest('[data-style]');
        if (!button || button.dataset.style === activeStyle || button.disabled) return;
        activeStyle = button.dataset.style;
        document.querySelectorAll('[data-style]').forEach(item => item.classList.toggle('active', item.dataset.style === activeStyle));
        styleReady = false;
        queuedCity = activeCity;
        setButtonsEnabled(false);
        showNotice(`正在切换到 ${activeStyle}…`);
        map.setStyle(STYLES[activeStyle]);
      });

      document.getElementById('cityButtons').addEventListener('click', event => {
        const button = event.target.closest('[data-city]');
        if (!button || button.disabled) return;
        if (!styleReady) {
          queuedCity = button.dataset.city;
          return;
        }
        moveToCity(button.dataset.city, true);
      });

      toggle3d.addEventListener('click', () => {
        if (!styleReady) return;
        threeD = !threeD;
        toggle3d.classList.toggle('active', threeD);
        apply3D();
        const city = CITIES[activeCity];
        map.easeTo({ pitch: threeD ? 48 : 0, bearing: threeD ? city.bearing : 0, duration: 420 });
        showNotice(`${activeStyle} · ${threeD ? '3D 建筑开启' : '3D 建筑关闭'}`);
      });

      view2d.addEventListener('click', () => map.easeTo({ pitch: 0, bearing: 0, duration: 420 }));
      viewTilt.addEventListener('click', () => {
        const city = CITIES[activeCity];
        map.easeTo({ pitch: 48, bearing: city.bearing, duration: 420 });
      });
    })();
  </script>
</body>
</html>
